name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-plugin.sh

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/hooks/slop-scan.test.sh
      - run: bash tests/hooks/claim-scan.test.sh
      - run: bash tests/hooks/channel-limits.test.sh
      - run: bash tests/hooks/publish-gate.test.sh
      - run: bash tests/hooks/session-start.test.sh
      - run: bash tests/hooks/prompt-router.test.sh
      - run: bash tests/hooks/branch-protect.test.sh
      - run: bash tests/hooks/block-dangerous-commands.test.sh
